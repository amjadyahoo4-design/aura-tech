<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Tech | المتجر الرقمي الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #050507; color: #f4f4f5; overflow-x: hidden; }
        .glass { background: rgba(18, 18, 24, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(24, 24, 32, 0.5); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.06); }
        #chat-messages::-webkit-scrollbar { width: 6px; }
        #chat-messages::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <header class="glass sticky top-0 z-40 border-b border-zinc-800/80">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <h1 class="text-base font-black bg-gradient-to-r from-amber-400 to-yellow-200 bg-clip-text text-transparent">AURA TECH</h1>
            <span class="bg-amber-500/10 text-amber-400 text-xs px-3 py-1.5 rounded-xl font-bold border border-amber-500/20">🤖 موظف المبيعات الذكي متصل</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-10">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black mb-2">تحدث مع خبير المبيعات الافتراضي</h2>
            <p class="text-zinc-400 text-xs">اسأله عن أي جهاز، ميزانية، أو استشارة تقنية وسينصحك كإنسان بشري تماماً.</p>
        </div>

        <!-- صندوق الدردشة -->
        <div class="glass rounded-3xl shadow-2xl border border-amber-500/30 overflow-hidden mb-12">
            <div id="chat-messages" class="p-6 h-[420px] overflow-y-auto space-y-4 flex flex-col">
                <div class="flex items-start gap-3 max-w-[85%]">
                    <div class="w-8 h-8 rounded-xl bg-amber-500 text-zinc-950 flex items-center justify-center font-bold text-xs shrink-0">🤖</div>
                    <div class="glass-card p-4 rounded-2xl rounded-tr-none text-xs leading-relaxed text-zinc-200">
                        أهلاً بك في Aura Tech! أنا معك لمساعدتك واختيار الجهاز الأنسب لك. كيف يمكنني خدمتك اليوم؟
                    </div>
                </div>
            </div>

            <div class="p-4 bg-zinc-900/60 border-t border-zinc-800 flex gap-2.5 items-center">
                <input type="text" id="chat-input" placeholder="اكتب استفسارك هنا (مثلاً: أريد هاتفاً ممتازاً للتصوير بحدود 1000$)..." onkeypress="handleKeyPress(event)" class="flex-1 bg-zinc-950 border border-zinc-800 px-4 py-3.5 rounded-2xl text-xs focus:outline-none focus:border-amber-500 text-zinc-100 placeholder-zinc-500">
                <button onclick="sendChatMessage()" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 px-6 py-3.5 rounded-2xl text-xs font-black transition">إرسال 💬</button>
            </div>
        </div>
    </main>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') sendChatMessage();
        }

        async function sendChatMessage() {
            const inputField = document.getElementById('chat-input');
            const messageContainer = document.getElementById('chat-messages');
            const userText = inputField.value.trim();
            if (!userText) return;

            // عرض رسالة المستخدم
            messageContainer.innerHTML += `
                <div class="flex items-start gap-3 max-w-[85%] self-end flex-row-reverse">
                    <div class="w-8 h-8 rounded-xl bg-zinc-800 text-amber-400 flex items-center justify-center font-bold text-xs shrink-0">👤</div>
                    <div class="bg-amber-500 text-zinc-950 font-medium p-4 rounded-2xl rounded-tl-none text-xs leading-relaxed">${escapeHTML(userText)}</div>
                </div>
            `;
            inputField.value = '';
            messageContainer.scrollTop = messageContainer.scrollHeight;

            // مؤشر الكتابة
            const loadingId = 'loading-' + Date.now();
            messageContainer.innerHTML += `
                <div id="${loadingId}" class="flex items-start gap-3 max-w-[85%]">
                    <div class="w-8 h-8 rounded-xl bg-amber-500 text-zinc-950 flex items-center justify-center font-bold text-xs shrink-0">🤖</div>
                    <div class="glass-card p-4 rounded-2xl rounded-tr-none text-xs text-zinc-400">الموظف يفكر ويكتب النصيحة...</div>
                </div>
            `;
            messageContainer.scrollTop = messageContainer.scrollHeight;

            try {
                // الاتصال المباشر بالسيرفر السحابي الخاص بك على Render
                const response = await fetch('https://aura-tech-26m6.onrender.com/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText })
                });

                const data = await response.json();
                
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                const aiResponse = data.reply || "أهلاً بك، تفضل بطرح استفسارك وسأساعدك فوراً.";
                
                // عرض رد الذكاء الاصطناعي البشري
                messageContainer.innerHTML += `
                    <div class="flex items-start gap-3 max-w-[85%]">
                        <div class="w-8 h-8 rounded-xl bg-amber-500 text-zinc-950 flex items-center justify-center font-bold text-xs shrink-0">🤖</div>
                        <div class="glass-card p-4 rounded-2xl rounded-tr-none text-xs leading-relaxed text-zinc-200 whitespace-pre-line border border-amber-500/20">${escapeHTML(aiResponse)}</div>
                    </div>
                `;
                messageContainer.scrollTop = messageContainer.scrollHeight;

            } catch (error) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                messageContainer.innerHTML += `
                    <div class="flex items-start gap-3 max-w-[85%]">
                        <div class="w-8 h-8 rounded-xl bg-red-500 text-white flex items-center justify-center font-bold text-xs shrink-0">⚠️</div>
                        <div class="glass-card p-4 rounded-2xl rounded-tr-none text-xs text-red-300">عذراً، حدث خطأ في الاتصال بالسيرفر. يرجى المحاولة مرة أخرى.</div>
                    </div>
                `;
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
